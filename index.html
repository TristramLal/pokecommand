const KEY='pokecommand:data:v1';const defaults=()=>({version:1,trainer:'Trainer',hunts:[{id:'tornadus',name:'Shadow Tornadus',normal:8,shiny:1,history:[]}],pokemon:[{id:'e',name:'Eternatus',nickname:'Futurebottlecap',cp:1852,fast:'Poison Jab',charged:'Dynamax Cannon',flags:'Legendary',candy:189,xl:114,maxAttack:1},{id:'h',name:'Hitmontop',cp:1216,fast:'Counter',charged:'Gyro Ball',flags:'Dynamax',maxAttack:1},{id:'z',name:'Zacian (Crowned Sword)',nickname:'Zack',cp:5485,atk:15,hp:15,flags:'Shiny, Legendary'}],community:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}if(!data.hunts||!data.pokemon||!data.community)data=defaults();let tab='Today';const tabs=['Today','Raids','Pokémon','Hunts','Community'];const events=[['18 Nov · 6–7 pm','Cresselia & Darkrai Raid Hour'],['19 Nov · 6–7 pm','Galar starter Spotlight Hour'],['21 Nov · 11 am–2 pm','Eternamax Eternatus Max Battle event'],['21 Nov · 2–5 pm','Pawniard Community Day']];const bosses=[['Cresselia','Bug, Ghost, Dark'],['Darkrai','Fighting, Bug, Fairy'],['Mega Banette','Ghost, Dark'],['Shadow Tornadus','Electric, Ice, Rock']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Storage unavailable. Export a backup.')}render()}function card(title,body,cls=''){return '<section class="card '+cls+'"><h3>'+title+'</h3>'+body+'</section>'}function btn(label,fn,cls=''){return '<button class="'+cls+'" onclick="'+fn+'">'+label+'</button>'}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+({Today:'⌂',Raids:'⚔',Pokémon:'◉',Hunts:'✦',Community:'♧'}[t])+'<br>'+t+'</button>').join('');let out='';if(tab==='Today'){out=card('Welcome back, '+esc(data.trainer)+' ✨','<p>Manage your raids, collection and shiny hunts in one place.</p><div class="stats"><div class="stat"><b>'+data.pokemon.length+'</b><small>Pokémon</small></div><div class="stat"><b>'+data.hunts.length+'</b><small>Hunts</small></div><div class="stat"><b>'+data.hunts.reduce((n,h)=>n+h.normal+h.shiny,0)+'</b><small>Raids logged</small></div></div>','hero')+'<div class="notice">Event briefing snapshot: 17 Nov 2026, Australia/Brisbane (AEST). Not live. Verify event dates and bosses before travelling.</div><h2>Upcoming events</h2>'+events.map(e=>card(esc(e[1]),'<span class="pill">'+esc(e[0])+'</span>')).join('')+'<p><a href="https://pokemongo.com/en/news" target="_blank" rel="noopener">Official Pokémon GO news</a> · <a href="https://pokemongohub.net/" target="_blank" rel="noopener">GO Hub</a></p>'}

const PHOTO_DB='pokecommand-photos-v1';let photoUrls=new Map();function photoDatabase(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB unavailable'));let req=indexedDB.open(PHOTO_DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('photos');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function savePokemonPhoto(id,file){let db=await photoDatabase();try{await new Promise((resolve,reject)=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}async function showPokemonPhotos(){let nodes=[...document.querySelectorAll('[data-poke-photo]')];if(!nodes.length)return;let db;try{db=await photoDatabase();for(let node of nodes){let id=node.dataset.pokePhoto;let blob=await new Promise((resolve,reject)=>{let req=db.transaction('photos','readonly').objectStore('photos').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(!blob||!node.isConnected)continue;let old=photoUrls.get(id);if(old)URL.revokeObjectURL(old);let url=URL.createObjectURL(blob);photoUrls.set(id,url);node.outerHTML='<img class="poke-photo" alt="Saved appraisal screenshot" src="'+url+'">'}}catch(e){console.warn('Pokémon photos unavailable',e)}finally{if(db)db.close()}}function pokemonPhotoTile(p){return '<div class="poke-placeholder" data-poke-photo="'+esc(p.id)+'">◉</div>'}
function showPokemonDetail(id){let p=data.pokemon.find(x=>x.id===id);if(!p)return;let fields=[['Nickname',p.nickname],['Form',p.form],['CP',p.cp],['Displayed HP',p.currentHP],['Attack IV',p.atk],['Defence IV',p.def],['HP IV',p.hp],['Primary type',p.type1],['Secondary type',p.type2],['Fast attack',p.fast],['Fast attack type',p.fastType],['Charged attack',p.charged],['Charged attack type',p.chargedType],['Flags',p.flags],['Candy',p.candy],['Candy XL',p.xl],['Max Attack',p.maxAttack],['Max Guard',p.maxGuard],['Max Spirit',p.maxSpirit]];let d=document.getElementById('modal');d.innerHTML='<h2>'+esc(p.name)+'</h2><div id="detailPhoto">'+pokemonPhotoTile(p)+'</div><p class="notice">View only. Tap Edit to change Pokémon information.</p><div class="poke-detail-grid">'+fields.map(([label,value])=>'<div><small>'+esc(label)+'</small><strong>'+esc(value===undefined||value===null||value===''?'—':value)+'</strong></div>').join('')+'</div><div class="row" style="margin-top:16px"><button type="button" id="detailEdit">✎ Edit</button><button type="button" class="warn" id="detailDelete">Delete</button><button type="button" class="secondary" id="detailClose">Close</button></div>';d.showModal();d.querySelector('#detailEdit').addEventListener('click',()=>{d.close();editPokemon(id)});d.querySelector('#detailDelete').addEventListener('click',()=>{d.close();deletePokemon(id)});d.querySelector('#detailClose').addEventListener('click',()=>d.close());showPokemonPhotos()}
function filterPokemon(q){let rows=data.pokemon.filter(p=>(p.name+' '+(p.nickname||'')+' '+(p.flags||'')).toLowerCase().includes(q.toLowerCase()));let list=document.getElementById('pokeList');list.innerHTML=rows.length?'<div class="poke-grid">'+rows.map(p=>'<section class="poke-tile" role="button" tabindex="0" data-tile-id="'+esc(p.id)+'" aria-label="View '+esc(p.name)+' details">'+pokemonPhotoTile(p)+'<h3>'+esc(p.name)+(p.nickname?' · '+esc(p.nickname):'')+'</h3></section>').join('')+'</div>':'<p class="muted">No Pokémon found.</p>';list.querySelectorAll('[data-tile-id]').forEach(node=>{let id=node.dataset.tileId;node.addEventListener('click',()=>showPokemonDetail(id));node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showPokemonDetail(id)}})});showPokemonPhotos()}
function addRaid(id,shiny){let h=data.hunts.find(x=>x.id===id);h[shiny?'shiny':'normal']++;h.history.push({shiny,time:new Date().toISOString()});save()}function undoRaid(id){let h=data.hunts.find(x=>x.id===id),a=h.history.pop();if(!a)return alert('No new raid to undo.');h[a.shiny?'shiny':'normal']--;save()}

async function readAppraisalBars(file){let bitmap=await createImageBitmap(file);try{let w=bitmap.width,h=bitmap.height;if(w<300||h<500)throw Error('Image too small');let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0);let img=ctx.getImageData(0,0,w,h).data;let x0=Math.round(w*.10),x1=Math.round(w*.49),y0=Math.round(h*.72),y1=Math.round(h*.91),step=Math.max(1,Math.floor(h/1200));let candidates=[];for(let y=y0;y<y1;y+=step){let coloured=[];for(let x=x0;x<x1;x++){let i=(y*w+x)*4,r=img[i],g=img[i+1],b=img[i+2];if((r>175&&g>90&&g<205&&b<145&&r>g*1.14)||(r>160&&g>70&&g<190&&b>80&&b<185&&r>g*1.22&&r>b*1.08))coloured.push(x)}if(coloured.length>w*.16){let first=coloured[0],last=coloured[coloured.length-1];if(last-first>w*.15)candidates.push({y,first,last})}}let groups=[];for(let c of candidates){let g=groups[groups.length-1];if(!g||c.y-g.lastY>Math.max(5,step*3))groups.push({lastY:c.y,rows:[c]});else{g.lastY=c.y;g.rows.push(c)}}groups=groups.filter(g=>g.rows.length>=2).sort((a,b)=>b.rows.length-a.rows.length).slice(0,3).sort((a,b)=>a.rows[0].y-b.rows[0].y);if(groups.length!==3)throw Error('Could not isolate three appraisal bars');let values=[];for(let g of groups){let row=g.rows[Math.floor(g.rows.length/2)],y=row.y,start=row.first,end=row.last;let right=Math.min(x1,Math.round(start+w*.38));let railEnd=end;for(let x=end+1;x<right;x++){let i=(y*w+x)*4,r=img[i],gr=img[i+1],b=img[i+2];if(Math.abs(r-gr)<24&&Math.abs(gr-b)<24&&r>135&&r<245)railEnd=x}let rail=railEnd-start+1;if(rail<w*.26||rail>w*.40)throw Error('Appraisal rail geometry uncertain');let fraction=(end-start+1)/rail;let value=Math.round(15*fraction);if(value<0||value>15||Math.abs(value/15-fraction)>.075)throw Error('Bar boundary uncertain');values.push(value)}return {atk:values[0],def:values[1],hp:values[2],note:'Experimental colour-bar estimate; verify all three IVs.'}}finally{bitmap.close()}}

async function recogniseAppraisal(){if(!appraisalDraft?.file){alert('Choose a screenshot first.');return}let draft=appraisalDraft,status=document.getElementById('appraisalStatus');status.textContent='Measuring appraisal bars...';let notes=[];try{let bars=await readAppraisalBars(draft.file);Object.assign(draft,bars);notes.push('IV estimates: '+bars.atk+'/'+bars.def+'/'+bars.hp)}catch(e){notes.push('IV bars not confidently detected ('+e.message+')')}status.textContent=notes.join('. ')+'. Reading text...';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>reject(Error('OCR library unavailable'));document.head.appendChild(script)})}let result=await Tesseract.recognize(draft.file,'eng');if(appraisalDraft!==draft)return;let raw=result.data.text||'';draft.raw=raw;let cp=raw.match(/\bCP\s*([0-9][0-9,]*)/i);if(cp)draft.cp=cp[1].replace(/,/g,'');if(!draft.cp){status.textContent='Trying enhanced CP recognition from the top of the screenshot...';try{let extra=await readAppraisalCP(draft.file);if(extra.cp&&Number(extra.cp)>=10&&Number(extra.cp)<=99999)draft.cp=extra.cp;else notes.push('CP not detected; OCR candidates: '+extra.text)}catch(e){notes.push('Enhanced CP scan unavailable: '+e.message)}}let hp=raw.match(/\b([0-9]{1,4})\s*\/\s*[0-9]{1,4}\s*HP\b/i)||raw.match(/\bHP\s*([0-9]{1,4})\b/i);if(hp)draft.currentHP=hp[1];let lines=raw.split(/\n/).map(x=>x.trim()).filter(Boolean);let known=baseStatsDB?.records||[];let matches=[];for(let line of lines){let clean=line.replace(/[^A-Za-z0-9 '-]/g,'').trim();if(clean.length<3||clean.length>28)continue;let hit=known.find(x=>x.name.toLowerCase()===clean.toLowerCase());if(hit)matches.push(hit.name)}if(matches.length===1)draft.name=matches[0];if(draft.name==='Persian'&&/\bDARK\b/i.test(raw)){draft.form='Alola';notes.push('Possible Alolan form (Dark type): confirm in r const SPECIES_DB_KEY='pokecommand-species-moves-v1';let speciesDB=null;try{let v=JSON.parse(localStorage.getItem(SPECIES_DB_KEY)||'null');if(v&&Array.isArray(v.records))speciesDB=v}catch(e){}
function speciesStatus(){return speciesDB?'Cached '+speciesDB.records.length+' species/form movesets. Downloaded '+new Date(speciesDB.fetchedAt).toLocaleString()+'. Source freshness unverified.':'No species movesets downloaded.'}
async function refreshSpeciesDB(){let el=document.getElementById('speciesDBStatus');if(el)el.textContent='Downloading species movesets...';try{let response=await fetch('https://pogoapi.net/api/v1/current_pokemon_moves.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);let records=await response.json();if(!Array.isArray(records)||records.length<500||!records.every(x=>typeof x.pokemon_name==='string'&&Array.isArray(x.fast_moves)&&Array.isArray(x.charged_moves)))throw Error('Unexpected moveset data');let db={records:records.map(x=>({name:x.pokemon_name,form:x.form||'Normal',fast:x.fast_moves,charged:x.charged_moves,eliteFast:x.elite_fast_moves||[],eliteCharged:x.elite_charged_moves||[]})),fetchedAt:new Date().toISOString()};localStorage.setItem(SPECIES_DB_KEY,JSON.stringify(db));speciesDB=db;if(el)el.textContent=speciesStatus();alert('Species movesets downloaded. Form and move availability may change; verify before using TMs.')}catch(e){if(el)el.textContent=speciesStatus();alert('Species download failed: '+e.message+'. Existing data is unchanged.')}}
function checkSpeciesMoves(id){let p=data.pokemon.find(x=>x.id===id);if(!p)return;if(!speciesDB){alert('Download species movesets in Settings first.');return}let norm=x=>String(x||'').trim().toLowerCase();let matches=speciesDB.records.filter(x=>norm(x.name)===norm(p.name));if(!matches.length){alert('No matching species found. Check the species name; special forms may be named differently.');return}let form=norm(p.form);let selected=form?matches.filter(x=>norm(x.form)===form):matches.length===1?matches:[];let validate=(move,kind)=>{if(!String(move||'').trim())return 'Not recorded';if(selected.length!==1)return 'Form not confirmed — select a form in the Pokémon editor';let x=selected[0],normal=kind==='fast'?x.fast:x.charged,elite=kind==='fast'?x.eliteFast:x.eliteCharged;if(normal.some(m=>norm(m)===norm(move)))return 'Listed in current moveset';if(elite.some(m=>norm(m)===norm(move)))return 'Listed as Elite/legacy';return 'Not listed for this form — verify manually (source may be outdated)'};let html='<p>Reference only. No saved moves will be changed. Source freshness is not independently verified.</p><p><b>Recorded Fast Attack:</b> '+esc(p.fast||'Not entered')+' — '+esc(validate(p.fast,'fast'))+'</p><p><b>Recorded Charged Attack:</b> '+esc(p.charged||'Not entered')+' — '+esc(validate(p.charged,'charged'))+'</p>'+(selected.length!==1?'<p class="notice">Multiple forms or no exact form match. Set the Form field in the editor to the exact reference form below before validating moves.</p>':'<p>Validated against form: <b>'+esc(selected[0].form)+'</b></p>')+matches.map(x=>'<details><summary>'+esc(x.name)+' — '+esc(x.form)+'</summary><p><b>Fast:</b> '+x.fast.map(esc).join(', ')+'</p><p><b>Charged:</b> '+x.charged.map(esc).join(', ')+'</p><p><b>Elite Fast:</b> '+(x.eliteFast.map(esc).join(', ')||'None listed')+'</p><p><b>Elite Charged:</b> '+(x.eliteCharged.map(esc).join(', ')||'None listed')+'</p></details>').join('');modal('Moveset check — '+p.name,html,()=>{})}

function moveType(p,kind){let override=(p[kind+'Type']||'').trim();let known=POKEMON_TYPES.find(t=>t.toLowerCase()===override.toLowerCase());if(override)return known||null;let move=(p[kind]||'').trim();if(moveDB&&moveDB.moves[move.toLowerCase()])return moveDB.moves[move.toLowerCase()];let key=Object.keys(MOVE_TYPES).find(k=>k.toLowerCase()===move.toLowerCase());return key?MOVE_TYPES[key]:null}

function referenceSelection(p){if(!speciesDB)return {status:'missing',matches:[]};let norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();let raw=String(p.name||'');let m=raw.match(/^(.+?)\s*\(([^)]+)\)\s*$/);let base=m?m[1]:raw,embedded=m?m[2]:'';let matches=speciesDB.records.filter(x=>norm(x.name)===norm(base));if(!matches.length)return {status:'species',matches:[]};let form=norm(p.form||embedded);let selected=form?matches.filter(x=>norm(x.form)===form):matches;if(selected.length===1)return {status:'matched',matches,record:selected[0]};if(!form&&matches.length>1){let normal=matches.filter(x=>['normal','standard',''].includes(norm(x.form)));if(normal.length===1)return {status:'matched',matches,record:normal[0]};let moveMatches=matches.filter(x=>{let f=norm(p.fast),c=norm(p.charged);return (!f||[...x.fast,...x.eliteFast].some(v=>norm(v)===f))&&(!c||[...x.charged,...x.eliteCharged].some(v=>norm(v)===c))});if(moveMatches.length===1)return {status:'matched',matches,record:moveMatches[0]}}return {status:'form',matches}}
const SPECIAL_MOVE_NOTES=[{species:'zacian',form:'crowned sword',move:'behemoth blade',note:'Signature move associated with Crowned Sword Zacian; source may omit special move availability.'}];
function specialMoveNote(p,move){let norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();let name=norm(p.name),form=norm(p.form);return SPECIAL_MOVE_NOTES.find(x=>name.includes(x.species)&&(name.includes(x.form)||form===x.form)&&norm(move)===x.move)?.note||''}
function moveConfidence(p){let norm=x=>String(x||'').trim().toLowerCase();if(!speciesDB)return 'Moveset not checked (download species data in Settings)';let result=referenceSelection(p);if(result.status==='species')return 'Species not found in reference';if(result.status!=='matched')return 'Form unconfirmed';let x=result.record;let check=(move,normal,elite)=>{if(!norm(move))return 'missing';if(normal.some(v=>norm(v)===norm(move)))return 'listed';if(elite.some(v=>norm(v)===norm(move)))return 'Elite/legacy';if(specialMoveNote(p,move))return 'special move (not listed by source)';return 'not listed'};let fast=check(p.fast,x.fast,x.eliteFast),charged=check(p.charged,x.charged,x.eliteCharged);return 'Fast '+fast+'; Charged '+charged+' (reference only)'}
function team(){let b=document.getElementById('boss');if(!b)return;let entry=bosses.find(x=>x[0]===b.value);if(!entry)return;let weak=entry[1].split(', ');let matches=data.pokemon.map(p=>{let fast=moveType(p,'fast'),charged=moveType(p,'charged');let fastMatch=!!fast&&weak.includes(fast),chargedMatch=!!charged&&weak.includes(charged);let knownCount=Number(!!fast)+Number(!!charged);let matchCount=Number(fastMatch)+Number(chargedMatch);let tier=matchCount===2?3:matchCount===1?2:knownCount===2?1:0;return {...p,fastTypeResolved:fast,chargedTypeResolved:charged,fastMatch,chargedMatch,tier,knownCount,matchCount}}).sort((a,b)=>b.tier-a.tier||b.matchCount-a.matchCount||b.knownCount-a.knownCount||Number(b.cp)-Number(a.cp));let stab=(p,type)=>{if(!type)return '';let types=resolvedPokemonTypes(p).types.map(x=>x.toLowerCase());return types.includes(type.toLowerCase())?' · STAB':''};let describe=p=>p.tier===3?'Both recorded attack types match':p.tier===2?'One recorded attack type matches':p.tier===1?'No recorded attack types match':'Insufficient move-type data';let explain=(move,type,match)=>!String(move||'').trim()?'Not recorded':!type?'Type unknown':esc(type)+(match?' · weakness match':' · no weakness match');document.getElementById('team').innerHTML='<p>Boss weaknesses: <b>'+weak.join(', ')+'</b></p>'+(matches.length?matches.slice(0,6).map((p,i)=>'<p>'+(i+1)+'. <b>'+esc(p.name)+'</b> · CP '+esc(p.cp)+'<br><small><b>'+esc(describe(p))+'</b></small><br><small>Fast: '+esc(p.fast||'Not recorded')+' ('+explain(p.fast,p.fastTypeResolved,p.fastMatch)+stab(p,p.fastTypeResolved)+')<br>Charged: '+esc(p.charged||'Not recorded')+' ('+explain(p.charged,p.chargedTypeResolved,p.chargedMatch)+stab(p,p.chargedTypeResolved)+')</small><br><small>Pokémon types: '+esc((()=>{let t=resolvedPokemonTypes(p);return t.types.length?t.types.join(' / ')+' ('+t.source+')':'Unknown ('+t.source+')'})())+'<br>Base stats: '+esc(baseStatsLabel(p))+'<br>Fast stats: '+esc(moveStatsLabel(p.fast,'fast'))+'<br>Charged stats: '+esc(moveStatsLabel(p.charged,'charged'))+'<br>Energy estimate: '+esc(energyCycleLabel(p))+'</small><br><small>Reference confidence: '+esc(moveConfidence(p))+'</small></p>').join(''):'<p>Add Pokémon to your collection to see candidates.</p>')+(matches.length&&!matches.some(p=>p.matchCount>0)?'<div class="notice">None of your recorded attacks match this boss\'s listed weaknesses. Consider checking alternative moves or other Pokémon before investing resources. This is not a prediction that the raid is unwinnable.</div>':'')+'<div class="notice">Candidates are grouped by recorded move-type coverage, then CP as a tiebreaker. This is NOT a damage, DPS, survival or battle performance ranking. Type matches use the listed boss weaknesses; STAB is labelled using manual types or uniquely matched downloaded species types; it does not affect ranking. Stats, resistances, Mega and Max mechanics are not simulated. Unknown moves are not treated as ineffective. Source freshness is unverified.</div>'}


function maxReadiness(){let root=document.getElementById('maxTeam');if(!root)return;let roster=data.pokemon.filter(p=>/dynamax|gigantamax/i.test(p.flags||''));if(!roster.length){root.innerHTML='<p>No Pokémon are marked Dynamax or Gigantamax yet. Edit a Pokémon and add one of those flags to include it here.</p>';return}let types=['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];let raw=(document.getElementById('maxWeaknesses')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);let valid=raw.map(x=>types.find(t=>t.toLowerCase()===x.toLowerCase())).filter(Boolean);let invalid=raw.filter(x=>!types.some(t=>t.toLowerCase()===x.toLowerCase()));let evaluated=roster.map(p=>{let fast=moveType(p,'fast');let match=!!fast&&valid.includes(fast);return {...p,fast,match}}).sort((a,b)=>Number(b.match)-Number(a.match)||Number(b.cp)-Number(a.cp));root.innerHTML=(invalid.length?'<p class="notice">Unrecognised types: '+invalid.map(esc).join(', ')+'. Use standard Pokémon type names.</p>':'')+(valid.length?'<p>Checking recorded Fast Attack types against: <b>'+valid.map(esc).join(', ')+'</b></p>':'<p class="muted">Add a boss weakness above to see potential type matches.</p>')+evaluated.map(p=>{let atk=Number(p.maxAttack)||0,guard=Number(p.maxGuard)||0,spirit=Number(p.maxSpirit)||0;let roles=[atk>0?'Max Attack Lv '+atk:'Max Attack not recorded',guard>0?'Max Guard Lv '+guard:'Max Guard not recorded',spirit>0?'Max Spirit Lv '+spirit:'Max Spirit not recorded'];let status=valid.length?(p.fast?(p.match?'✓ Fast Attack type matches entered weakness':'Fast Attack type does not match entered weaknesses'):'Fast Attack type unknown; no match assumed'):'Fast Attack type: '+(p.fast||'unknown');return '<div style="border-top:1px solid #34355e;padding:12px 0"><b>'+esc(p.nickname||p.name)+'</b> · CP '+esc(p.cp||'?')+'<br><small>'+esc(status)+'<br>'+roles.map(esc).join('<br>')+'</small><p>'+btn('Edit Max moves',"editPokemon('"+p.id+"')",'secondary')+'</p></div>'}).join('')+'<small>Matches only compare recorded Fast Attack types with manually entered boss weaknesses. Max Attack typing, species eligibility, defensive matchups, damage, team size and boss moves are not calculated. An unlocked Max Guard or Max Spirit is only a possible support option, not a role recommendation.</small>'}

function editMeetup(){modal('Plan meetup',field('name','Event name')+field('date','Date and time','', 'datetime-local')+field('place','Meeting location','Harmony Boulevard Park, Palmview')+field('notes','Details'),f=>data.community.push({id:uid(),name:f.get('name'),date:f.get('date'),place:f.get('place'),notes:f.get('notes')}))}
function deleteMeetup(id){if(confirm('Delete meetup?')){data.community=data.community.filter(x=>x.id!==id);save()}}function copyMeetup(id){let c=data.community.find(x=>x.id===id);navigator.clipboard.writeText(c.name+'\n'+c.date+'\n'+c.place+'\n'+c.notes).then(()=>alert('Copied!'))}
async function checkAppUpdates(){let btn=document.querySelector('header button[onclick="checkAppUpdates()"]');if(btn){btn.disabled=true;btn.textContent='Checking...'}try{let url=new URL('./index.html',location.href);url.searchParams.set('check',Date.now().toString());let response=await fetch(url.href,{cache:'no-store'});if(!response.ok)throw Error('Could not reach GitHub Pages (HTTP '+response.status+')');let html=await response.text();let found=html.match(/<meta name="pokecommand-build" content="([^"]+)"/);if(!found)throw Error('Published version marker not found');let current=document.querySelector('meta[name="pokecommand-build"]')?.content||'older';if(found[1]===current){alert('PokéCommand is up to date (v'+current+').');return}if(!confirm('PokéCommand v'+found[1]+' is available (installed: '+current+'). Reload to update now? Your locally saved Pokémon and hunts will not be cleared.'))return;if('serviceWorker'in navigator){let reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}let next=new URL(location.href);next.searchParams.set('appVersion',found[1]);location.replace(next.href)}catch(e){alert('Update check failed: '+e.message+'. Try opening the GitHub Pages website in your browser.')}finally{if(btn){btn.disabled=false;btn.textContent='↻ Update'}}}
function settings(){modal('Settings & backups',field('trainer','Trainer name',data.trainer)+'<p>Export a backup regularly. Data is stored only on this device/browser.</p><h3>Pokémon base statistics</h3><p id="baseStatsStatus">'+esc(baseStatsStatus())+'</p><p><button type="button" class="secondary" onclick="refreshBaseStats()">Download Pokémon base stats</button></p><small>Base Attack, Defence and Stamina only. Form matches must be unambiguous; no DPS or level calculation yet.</small><h3>Battle move statistics</h3><p id="moveStatsStatus">'+esc(moveStatsStatus())+'</p><p><button type="button" class="secondary" onclick="refreshMoveStats()">Download battle statistics</button></p><small>Power, energy and duration are shown as supplied; missing values remain n/a. No DPS calculation yet.</small><h3>Move reference database</h3><p id="moveDBStatus">'+esc(moveDBStatus())+'</p><p><button type="button" class="secondary" onclick="refreshMoveDB()">Download move data</button></p><h3>Species types</h3><p id="typeDBStatus">'+esc(typeDBStatus())+'</p><p><button type="button" class="secondary" onclick="refreshTypeDB()">Download species types</button></p><small>Manual types take priority; ambiguous forms are not guessed.</small><h3>Species movesets</h3><p id="speciesDBStatus">'+esc(speciesStatus())+'</p><p><button type="button" class="secondary" onclick="refreshSpeciesDB()">Download species movesets</button></p><small>Includes form-specific fast, charged and Elite move lists where provided. Source freshness is unverified.</small><small>Source: PoGoAPI. Downloads are optional; source freshness and move accuracy are not guaranteed. This reference is stored separately from your Pokémon collection.</small><button type="button" class="secondary" onclick="backup()">Export JSON backup</button><p><label>Restore JSON backup<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label></p>',f=>data.trainer=f.get('trainer')||'Trainer')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='pokecommand-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.hunts)||!Array.isArray(obj.pokemon)||!Array.isArray(obj.community))throw Error('Invalid format');if(confirm('Replace ALL saved data with this backup?')){data=obj;document.getElementById('modal').close();save()}}catch(e){alert('Could not restore backup: '+e.message)}}async function requestPortrait(){try{if(screen.orientation&&typeof screen.orientation.lock==='function')await screen.orientation.lock('portrait')}catch(e){/* iOS and some browsers do not permit orientation lock; manifest remains the fallback. */}}
window.addEventListener('pageshow',requestPortrait);document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestPortrait()});requestPortrait();
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
