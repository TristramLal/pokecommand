<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11122b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PokéCommand"><link rel="manifest" href="manifest.webmanifest"><title>PokéCommand</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f4f1ff;background:#090c1c}*{box-sizing:border-box}body{margin:0}header{padding:23px 20px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}h2{font-size:19px;margin:16px 0}h3{margin:0 0 12px}small,.muted{color:#a9aac5}main{max-width:650px;margin:auto;padding:0 17px 110px}.card{background:linear-gradient(140deg,#222344,#161a32);border:1px solid #34355e;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 22px #0003}.hero{background:linear-gradient(130deg,#42328c,#172d63)}button,input,select,textarea{font:inherit}button{background:#6255ce;color:white;border:0;border-radius:12px;padding:11px 15px;cursor:pointer}button.secondary{background:#313455}button.warn{background:#8d3d60}input,select,textarea{width:100%;background:#11142a;border:1px solid #555579;color:white;border-radius:10px;padding:12px;margin:6px 0 12px}label{display:block;color:#c5c5dd;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;background:#111427ee;backdrop-filter:blur(15px);border-top:1px solid #363957;display:flex;justify-content:space-around;padding:10px 3px max(10px,env(safe-area-inset-bottom))}nav button{font-size:12px;background:none;color:#b5b7d0;padding:9px 5px;flex:1}nav button.active{color:#ffcf6b;background:#292a51}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex-shrink:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:12px;background:#10142c;border-radius:12px;text-align:center}.stat b{display:block;font-size:23px;color:#ffcf77}.pill{display:inline-block;padding:4px 9px;border-radius:15px;background:#38355e;font-size:12px;margin:3px}.notice{padding:12px;border-left:3px solid #e3ba61;background:#342d35;border-radius:8px;color:#ffe3b5}a{color:#aebdff}.spacer{height:6px}dialog{background:#171a33;color:white;border:1px solid #555579;border-radius:20px;width:min(94vw,500px);max-height:85vh;overflow:auto}dialog::backdrop{background:#000b}button:focus-visible,input:focus-visible{outline:2px solid #ffcf77}@media(min-width:700px){nav{left:50%;transform:translateX(-50%);max-width:650px;border-radius:20px 20px 0 0}}
</style></head><body><header><div><small>YOUR TRAINER HQ</small><h1>◈ PokéCommand</h1></div><button class="secondary" onclick="settings()">⚙ Settings</button></header><main id="view"></main><nav id="nav"></nav><dialog id="modal"></dialog><script>
const KEY='pokecommand:data:v1';const defaults=()=>({version:1,trainer:'Trainer',hunts:[{id:'tornadus',name:'Shadow Tornadus',normal:8,shiny:1,history:[]}],pokemon:[{id:'e',name:'Eternatus',nickname:'Futurebottlecap',cp:1852,fast:'Poison Jab',charged:'Dynamax Cannon',flags:'Legendary',candy:189,xl:114,maxAttack:1},{id:'h',name:'Hitmontop',cp:1216,fast:'Counter',charged:'Gyro Ball',flags:'Dynamax',maxAttack:1},{id:'z',name:'Zacian (Crowned Sword)',nickname:'Zack',cp:5485,atk:15,hp:15,flags:'Shiny, Legendary'}],community:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}if(!data.hunts||!data.pokemon||!data.community)data=defaults();let tab='Today';const tabs=['Today','Raids','Pokémon','Hunts','Community'];const events=[['18 Nov · 6–7 pm','Cresselia & Darkrai Raid Hour'],['19 Nov · 6–7 pm','Galar starter Spotlight Hour'],['21 Nov · 11 am–2 pm','Eternamax Eternatus Max Battle event'],['21 Nov · 2–5 pm','Pawniard Community Day']];const bosses=[['Cresselia','Bug, Ghost, Dark'],['Darkrai','Fighting, Bug, Fairy'],['Mega Banette','Ghost, Dark'],['Shadow Tornadus','Electric, Ice, Rock']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Storage unavailable. Export a backup.')}render()}function card(title,body,cls=''){return '<section class="card '+cls+'"><h3>'+title+'</h3>'+body+'</section>'}function btn(label,fn,cls=''){return '<button class="'+cls+'" onclick="'+fn+'">'+label+'</button>'}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+({Today:'⌂',Raids:'⚔',Pokémon:'◉',Hunts:'✦',Community:'♧'}[t])+'<br>'+t+'</button>').join('');let out='';if(tab==='Today'){out=card('Welcome back, '+esc(data.trainer)+' ✨','<p>Manage your raids, collection and shiny hunts in one place.</p><div class="stats"><div class="stat"><b>'+data.pokemon.length+'</b><small>Pokémon</small></div><div class="stat"><b>'+data.hunts.length+'</b><small>Hunts</small></div><div class="stat"><b>'+data.hunts.reduce((n,h)=>n+h.normal+h.shiny,0)+'</b><small>Raids logged</small></div></div>','hero')+'<div class="notice">Event briefing snapshot: 17 Nov 2026, Australia/Brisbane (AEST). Not live. Verify event dates and bosses before travelling.</div><h2>Upcoming events</h2>'+events.map(e=>card(esc(e[1]),'<span class="pill">'+esc(e[0])+'</span>')).join('')+'<p><a href="https://pokemongo.com/en/news" target="_blank" rel="noopener">Official Pokémon GO news</a> · <a href="https://pokemongohub.net/" target="_blank" rel="noopener">GO Hub</a></p>'}
if(tab==='Hunts'){out='<h2>Shiny hunts</h2>'+btn('+ New hunt','editHunt()')+data.hunts.map(h=>{let total=h.normal+h.shiny;return card(esc(h.name),'<div class="stats"><div class="stat"><b>'+total+'</b><small>Raids</small></div><div class="stat"><b>'+h.shiny+'</b><small>Shinies</small></div><div class="stat"><b>'+(total?((h.shiny/total)*100).toFixed(1):'0')+'%</b><small>Your rate</small></div></div><p class="row">'+btn('+1 Normal',"addRaid('"+h.id+"',false)")+' '+btn('+1 Shiny',"addRaid('"+h.id+"',true)")+'</p><div class="row">'+btn('Undo',"undoRaid('"+h.id+"')",'secondary')+' '+btn('Edit',"editHunt('"+h.id+"')",'secondary')+'</div><small>Undo applies to new taps only.</small>')}).join('')}
if(tab==='Pokémon'){out='<h2>My Pokémon</h2>'+btn('+ Add Pokémon','editPokemon()')+'<input id="search" placeholder="Search collection…" oninput="filterPokemon(this.value)"><div id="pokeList"></div>';document.getElementById('view').innerHTML=out;filterPokemon('');return}
if(tab==='Raids'){out='<h2>Raid team planner</h2><div class="notice">Early heuristic only: not a damage simulation. Check moves and battle mechanics before using recommendations.</div>'+card('Choose boss','<select id="boss" onchange="team()">'+bosses.map(b=>'<option>'+b[0]+'</option>').join('')+'</select><div id="team"></div>')}
if(tab==='Community'){out='<h2>Harmony & Palmview</h2>'+btn('+ Plan meetup','editMeetup()')+data.community.map(c=>card(esc(c.name),'<p>'+esc(c.date)+' · '+esc(c.place)+'</p><p>'+esc(c.notes)+'</p>'+btn('Copy description',"copyMeetup('"+c.id+"')",'secondary')+' '+btn('Delete',"deleteMeetup('"+c.id+"')",'warn'))).join('')}
document.getElementById('view').innerHTML=out;if(tab==='Raids')team()}
function filterPokemon(q){document.getElementById('pokeList').innerHTML=data.pokemon.filter(p=>(p.name+' '+(p.nickname||'')+' '+(p.flags||'')).toLowerCase().includes(q.toLowerCase())).map(p=>card(esc(p.name)+(p.nickname?' · '+esc(p.nickname):''),'<span class="pill">CP '+esc(p.cp||'?')+'</span><span class="pill">'+esc(p.flags||'Normal')+'</span><p>'+esc(p.fast||'Fast move unknown')+' / '+esc(p.charged||'Charged move unknown')+'</p>'+btn('Edit',"editPokemon('"+p.id+"')",'secondary')+' '+btn('Delete',"deletePokemon('"+p.id+"')",'warn'))).join('')||'<p class="muted">No Pokémon found.</p>'}
function addRaid(id,shiny){let h=data.hunts.find(x=>x.id===id);h[shiny?'shiny':'normal']++;h.history.push({shiny,time:new Date().toISOString()});save()}function undoRaid(id){let h=data.hunts.find(x=>x.id===id),a=h.history.pop();if(!a)return alert('No new raid to undo.');h[a.shiny?'shiny':'normal']--;save()}
function modal(title,fields,submit){let d=document.getElementById('modal');d.innerHTML='<form id="editform"><h2>'+title+'</h2>'+fields+'<div class="row"><button type="submit">Save</button><button type="button" class="secondary" onclick="document.getElementById(\'modal\').close()">Cancel</button></div></form>';d.showModal();document.getElementById('editform').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target));d.close();save()}}
function field(k,label,value='',type='text'){return '<label>'+label+'<input name="'+k+'" type="'+type+'" value="'+esc(value)+'"></label>'}
function editHunt(id){let h=data.hunts.find(x=>x.id===id)||{name:'',normal:0,shiny:0};modal(id?'Edit hunt':'New hunt',field('name','Pokémon name',h.name)+field('normal','Normal raids',h.normal,'number')+field('shiny','Shiny raids',h.shiny,'number'),f=>{let obj={...h,id:id||uid(),name:f.get('name').trim(),normal:Math.max(0,+f.get('normal')||0),shiny:Math.max(0,+f.get('shiny')||0),history:h.history||[]};if(!obj.name)return;if(id)Object.assign(h,obj);else data.hunts.push(obj)})}
function deletePokemon(id){let p=data.pokemon.find(x=>x.id===id);if(!p)return;if(confirm('Delete '+p.name+' from your collection? This cannot be undone.')){data.pokemon=data.pokemon.filter(x=>x.id!==id);save()}}
function editPokemon(id){let p=data.pokemon.find(x=>x.id===id)||{};let keys=[['name','Pokémon'],['nickname','Nickname'],['cp','CP'],['atk','Attack IV (0–15)'],['def','Defence IV (0–15)'],['hp','HP IV (0–15)'],['fast','Fast attack'],['charged','Charged attack'],['flags','Flags (Shiny, Shadow, Dynamax etc.)'],['candy','Candy'],['xl','Candy XL'],['maxAttack','Max Attack level'],['maxGuard','Max Guard level'],['maxSpirit','Max Spirit level']];modal(id?'Edit Pokémon':'Add Pokémon',keys.map(([k,l])=>field(k,l,p[k]??'', ['cp','atk','def','hp','candy','xl','maxAttack','maxGuard','maxSpirit'].includes(k)?'number':'text')).join(''),f=>{let obj={id:id||uid()};keys.forEach(([k])=>obj[k]=f.get(k));if(!obj.name.trim())return;if(id)Object.assign(p,obj);else data.pokemon.push(obj)})}
const MOVE_TYPES={'Poison Jab':'Poison','Dynamax Cannon':'Dragon','Counter':'Fighting','Gyro Ball':'Steel','Thunder Shock':'Electric','Thunderbolt':'Electric','Play Rough':'Fairy','Close Combat':'Fighting','Snarl':'Dark','Dark Pulse':'Dark','Shadow Claw':'Ghost','Shadow Ball':'Ghost','Bug Bite':'Bug','X-Scissor':'Bug','Ice Shard':'Ice','Ice Beam':'Ice','Rock Throw':'Rock','Rock Slide':'Rock','Charm':'Fairy','Dazzling Gleam':'Fairy','Bite':'Dark','Crunch':'Dark','Lick':'Ghost','Hex':'Ghost','Astonish':'Ghost','Volt Switch':'Electric','Wild Charge':'Electric'};
function team(){let b=document.getElementById('boss');if(!b)return;let boss=b.value,weak=bosses.find(x=>x[0]===boss)[1].split(', ');let matches=data.pokemon.map(p=>{let fast=MOVE_TYPES[(p.fast||'').trim()],charged=MOVE_TYPES[(p.charged||'').trim()];let fastMatch=!!fast&&weak.includes(fast),chargedMatch=!!charged&&weak.includes(charged);return {...p,fast,charged,fastMatch,chargedMatch,score:(fastMatch?2:0)+(chargedMatch?3:0)}}).sort((a,b)=>b.score-a.score||Number(b.cp)-Number(a.cp));document.getElementById('team').innerHTML='<p>Boss weaknesses: <b>'+weak.join(', ')+'</b></p>'+matches.slice(0,6).map((p,i)=>'<p>'+(i+1)+'. <b>'+esc(p.name)+'</b> · CP '+esc(p.cp)+'<br><small>Fast: '+esc(p.fast||'Unknown type')+(p.fastMatch?' ✓ effective':'')+' · Charged: '+esc(p.charged||'Unknown type')+(p.chargedMatch?' ✓ effective':'')+'</small></p>').join('')+'<div class="notice">Move types are checked against a small built-in reference. Unknown moves are not assumed effective. Rankings are preliminary, not DPS calculations; Pokémon species, stats, resistances, Mega and Max mechanics are not simulated.</div>'}

function editMeetup(){modal('Plan meetup',field('name','Event name')+field('date','Date and time','', 'datetime-local')+field('place','Meeting location','Harmony Boulevard Park, Palmview')+field('notes','Details'),f=>data.community.push({id:uid(),name:f.get('name'),date:f.get('date'),place:f.get('place'),notes:f.get('notes')}))}
function deleteMeetup(id){if(confirm('Delete meetup?')){data.community=data.community.filter(x=>x.id!==id);save()}}function copyMeetup(id){let c=data.community.find(x=>x.id===id);navigator.clipboard.writeText(c.name+'\n'+c.date+'\n'+c.place+'\n'+c.notes).then(()=>alert('Copied!'))}
function settings(){modal('Settings & backups',field('trainer','Trainer name',data.trainer)+'<p>Export a backup regularly. Data is stored only on this device/browser.</p><button type="button" class="secondary" onclick="backup()">Export JSON backup</button><p><label>Restore JSON backup<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label></p>',f=>data.trainer=f.get('trainer')||'Trainer')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='pokecommand-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.hunts)||!Array.isArray(obj.pokemon)||!Array.isArray(obj.community))throw Error('Invalid format');if(confirm('Replace ALL saved data with this backup?')){data=obj;document.getElementById('modal').close();save()}}catch(e){alert('Could not restore backup: '+e.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
