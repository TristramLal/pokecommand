const KEY='pokecommand:data:v1';const defaults=()=>({version:1,trainer:'Trainer',hunts:[{id:'tornadus',name:'Shadow Tornadus',normal:8,shiny:1,history:[]}],pokemon:[{id:'e',name:'Eternatus',nickname:'Futurebottlecap',cp:1852,fast:'Poison Jab',charged:'Dynamax Cannon',flags:'Legendary',candy:189,xl:114,maxAttack:1},{id:'h',name:'Hitmontop',cp:1216,fast:'Counter',charged:'Gyro Ball',flags:'Dynamax',maxAttack:1},{id:'z',name:'Zacian (Crowned Sword)',nickname:'Zack',cp:5485,atk:15,hp:15,flags:'Shiny, Legendary'}],community:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}if(!data.hunts||!data.pokemon||!data.community)data=defaults();let tab='Today';const tabs=['Today','Raids','Pokémon','Hunts','Community'];const events=[['18 Nov · 6–7 pm','Cresselia & Darkrai Raid Hour'],['19 Nov · 6–7 pm','Galar starter Spotlight Hour'],['21 Nov · 11 am–2 pm','Eternamax Eternatus Max Battle event'],['21 Nov · 2–5 pm','Pawniard Community Day']];const bosses=[['Cresselia','Bug, Ghost, Dark'],['Darkrai','Fighting, Bug, Fairy'],['Mega Banette','Ghost, Dark'],['Shadow Tornadus','Electric, Ice, Rock']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Storage unavailable. Export a backup.')}render()}function card(title,body,cls=''){return '<section class="card '+cls+'"><h3>'+title+'</h3>'+body+'</section>'}function btn(label,fn,cls=''){return '<button class="'+cls+'" onclick="'+fn+'">'+label+'</button>'}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+({Today:'⌂',Raids:'⚔',Pokémon:'◉',Hunts:'✦',Community:'♧'}[t])+'<br>'+t+'</button>').join('');let out='';if(tab==='Today'){out=card('Welcome back, '+esc(data.trainer)+' ✨','<p>Manage your raids, collection and shiny hunts in one place.</p><div class="stats"><div class="stat"><b>'+data.pokemon.length+'</b><small>Pokémon</small></div><div class="stat"><b>'+data.hunts.length+'</b><small>Hunts</small></div><div class="stat"><b>'+data.hunts.reduce((n,h)=>n+h.normal+h.shiny,0)+'</b><small>Raids logged</small></div></div>','hero')+'<div class="notice">Event briefing snapshot: 17 Nov 2026, Australia/Brisbane (AEST). Not live. Verify event dates and bosses before travelling.</div><h2>Upcoming events</h2>'+events.map(e=>card(esc(e[1]),'<span class="pill">'+esc(e[0])+'</span>')).join('')+'<p><a href="https://pokemongo.com/en/news" target="_blank" rel="noopener">Official Pokémon GO news</a> · <a href="https://pokemongohub.net/" target="_blank" rel="noopener">GO Hub</a></p>'}
if(tab==='Hunts'){out='<h2>Shiny hunts</h2>'+btn('+ New hunt','editHunt()')+data.hunts.map(h=>{let total=h.normal+h.shiny;return card(esc(h.name),'<div class="stats"><div class="stat"><b>'+total+'</b><small>Raids</small></div><div class="stat"><b>'+h.shiny+'</b><small>Shinies</small></div><div class="stat"><b>'+(total?((h.shiny/total)*100).toFixed(1):'0')+'%</b><small>Your rate</small></div></div><p class="row">'+btn('+1 Normal',"addRaid('"+h.id+"',false)")+' '+btn('+1 Shiny',"addRaid('"+h.id+"',true)")+'</p><div class="row">'+btn('Undo',"undoRaid('"+h.id+"')",'secondary')+' '+btn('Edit',"editHunt('"+h.id+"')",'secondary')+'</div><small>Undo applies to new taps only.</small>')}).join('')}

function filterPokemon(q){document.getElementById('pokeList').innerHTML=data.pokemon.filter(p=>(p.name+' '+(p.nickname||'')+' '+(p.flags||'')).toLowerCase().includes(q.toLowerCase())).map(p=>card(esc(p.name)+(p.nickname?' · '+esc(p.nickname):''),'<span class="pill">CP '+esc(p.cp||'?')+'</span><span class="pill">'+esc(p.flags||'Normal')+'</span><p>'+esc(p.fast||'Fast move unknown')+' / '+esc(p.charged||'Charged move unknown')+'</p>'+btn('Edit',"editPokemon('"+p.id+"')",'secondary')+' '+btn('Delete',"deletePokemon('"+p.id+"')",'warn'))).join('')||'<p class="muted">No Pokémon found.</p>'}
function addRaid(id,shiny){let h=data.hunts.find(x=>x.id===id);h[shiny?'shiny':'normal']++;h.history.push({shiny,time:new Date().toISOString()});save()}function undoRaid(id){let h=data.hunts.find(x=>x.id===id),a=h.history.pop();if(!a)return alert('No new raid to undo.');h[a.shiny?'shiny':'normal']--;save()}
function modal(title,fields,submit){let d=document.getElementById('modal');d.innerHTML='<form id="editform"><h2>'+title+'</h2>'+fields+'<div class="row"><button type="submit">Save</button><button type="button" class="secondary" onclick="document.getElementById(\'modal\').close()">Cancel</button></div></form>';d.showModal();document.getElementById('editform').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target));d.close();save()}}
function field(k,label,value='',type='text'){return '<label>'+label+'<input name="'+k+'" type="'+type+'" value="'+esc(value)+'"></label>'}
function editHunt(id){let h=data.hunts.find(x=>x.id===id)||{name:'',normal:0,shiny:0};modal(id?'Edit hunt':'New hunt',field('name','Pokémon name',h.name)+field('normal','Normal raids',h.normal,'number')+field('shiny','Shiny raids',h.shiny,'number'),f=>{let obj={...h,id:id||uid(),name:f.get('name').trim(),normal:Math.max(0,+f.get('normal')||0),shiny:Math.max(0,+f.get('shiny')||0),history:h.history||[]};if(!obj.name)return;if(id)Object.assign(h,obj);else data.hunts.push(obj)})}
function deletePokemon(id){let p=data.pokemon.find(x=>x.id===id);if(!p)return;if(confirm('Delete '+p.name+' from your collection? This cannot be undone.')){data.pokemon=data.pokemon.filter(x=>x.id!==id);save()}}
function editPokemon(id){let p=data.pokemon.find(x=>x.id===id)||{};let keys=[['name','Pokémon'],['form','Form (optional; match reference name)'],['type1','Pokémon primary type (optional)'],['type2','Pokémon secondary type (optional)'],['nickname','Nickname'],['cp','CP'],['atk','Attack IV (0–15)'],['def','Defence IV (0–15)'],['hp','HP IV (0–15)'],['fast','Fast attack'],['fastType','Fast attack type override (optional)'],['charged','Charged attack'],['chargedType','Charged attack type override (optional)'],['flags','Flags (Shiny, Shadow, Dynamax etc.)'],['candy','Candy'],['xl','Candy XL'],['maxAttack','Max Attack level'],['maxGuard','Max Guard level'],['maxSpirit','Max Spirit level']];modal(id?'Edit Pokémon':'Add Pokémon',keys.map(([k,l])=>field(k,l,p[k]??'', ['cp','atk','def','hp','candy','xl','maxAttack','maxGuard','maxSpirit'].includes(k)?'number':'text')).join('')+(id?'<p><button type="button" class="secondary" onclick="checkSpeciesMoves(\''+id+'\')">View available moves</button></p>':''),f=>{let obj={id:id||uid()};keys.forEach(([k])=>obj[k]=f.get(k));if(!obj.name.trim())return;if(id)Object.assign(p,obj);else data.pokemon.push(obj)})}
const MOVE_TYPES={'Poison Jab':'Poison','Dynamax Cannon':'Dragon','Counter':'Fighting','Gyro Ball':'Steel','Metal Claw':'Steel','Behemoth Blade':'Steel','Thunder Shock':'Electric','Thunderbolt':'Electric','Play Rough':'Fairy','Close Combat':'Fighting','Snarl':'Dark','Dark Pulse':'Dark','Shadow Claw':'Ghost','Shadow Ball':'Ghost','Bug Bite':'Bug','X-Scissor':'Bug','Ice Shard':'Ice','Ice Beam':'Ice','Rock Throw':'Rock','Rock Slide':'Rock','Charm':'Fairy','Dazzling Gleam':'Fairy','Bite':'Dark','Crunch':'Dark','Lick':'Ghost','Hex':'Ghost','Astonish':'Ghost','Volt Switch':'Electric','Wild Charge':'Electric'};
const POKEMON_TYPES=['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
const TYPE_DB_KEY='pokecommand-species-types-v1';let typeDB=null;try{let v=JSON.parse(localStorage.getItem(TYPE_DB_KEY)||'null');if(v&&Array.isArray(v.records))typeDB=v}catch(e){}
function typeDBStatus(){return typeDB?'Cached '+typeDB.records.length+' species/form types; downloaded '+new Date(typeDB.fetchedAt).toLocaleString()+'. Freshness unverified.':'No downloaded species types.'}
async function refreshTypeDB(){let el=document.getElementById('typeDBStatus');if(el)el.textContent='Downloading...';try{let r=await fetch('https://pogoapi.net/api/v1/pokemon_types.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let raw=await r.json();if(!Array.isArray(raw))throw Error('Unexpected data format');let records=raw.filter(x=>typeof x.pokemon_name==='string'&&Array.isArray(x.type)&&x.type.length>0&&x.type.length<=2&&x.type.every(t=>POKEMON_TYPES.includes(t))).map(x=>({name:x.pokemon_name,form:x.form||'',types:x.type}));if(records.length<500)throw Error('Too few valid records');let db={records,fetchedAt:new Date().toISOString()};localStorage.setItem(TYPE_DB_KEY,JSON.stringify(db));typeDB=db;if(el)el.textContent=typeDBStatus();alert('Species types downloaded; manual types unchanged.')}catch(e){if(el)el.textContent=typeDBStatus();alert('Type download failed: '+e.message+'. Saved data unchanged.')}}
function resolvedPokemonTypes(p){let manual=[p.type1,p.type2].map(x=>String(x||'').trim()).filter(Boolean);if(manual.length)return {types:manual,source:'manual'};if(!typeDB)return {types:[],source:'not downloaded'};let norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();let m=String(p.name||'').match(/^(.+?)\s*\(([^)]+)\)\s*$/);let name=m?m[1]:p.name,form=norm(p.form||(m?m[2]:''));let rows=typeDB.records.filter(x=>norm(x.name)===norm(name));if(form)rows=rows.filter(x=>norm(x.form)===form);else if(rows.length>1){let defaults=rows.filter(x=>['','normal','standard'].includes(norm(x.form)));if(defaults.length===1)rows=defaults}return rows.length===1?{types:rows[0].types,source:'reference'}:{types:[],source:rows.length?'ambiguous form':'not found'}}
const MOVE_DB_KEY='pokecommand-move-db-v1';let moveDB=null;try{let cached=JSON.parse(localStorage.getItem(MOVE_DB_KEY)||'null');if(cached&&cached.moves&&typeof cached.moves==='object')moveDB=cached}catch(e){}
function moveDBStatus(){return moveDB?'Cached '+Object.keys(moveDB.moves).length+' move names. Downloaded '+new Date(moveDB.fetchedAt).toLocaleString()+'. Source freshness is not independently verified.':'No downloaded move database. Using the built-in fallback list.'}
async function refreshMoveDB(){let el=document.getElementById('moveDBStatus');if(el)el.textContent='Downloading move records...';try{let urls=['https://pogoapi.net/api/v1/fast_moves.json','https://pogoapi.net/api/v1/charged_moves.json'];let responses=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'})));if(responses.some(r=>!r.ok))throw Error('Source returned an HTTP error');let lists=await Promise.all(responses.map(r=>r.json()));if(lists.some(a=>!Array.isArray(a)||a.length<50))throw Error('Unexpected data format');let moves={};for(let list of lists)for(let m of list){if(typeof m.name!=='string'||typeof m.type!=='string')continue;let t=POKEMON_TYPES.find(x=>x.toLowerCase()===m.type.trim().toLowerCase());if(t)moves[m.name.trim().toLowerCase()]=t}if(Object.keys(moves).length<100)throw Error('Not enough valid move records');let db={moves,fetchedAt:new Date().toISOString(),source:'PoGoAPI fast_moves and charged_moves'};localStorage.setItem(MOVE_DB_KEY,JSON.stringify(db));moveDB=db;if(el)el.textContent=moveDBStatus();alert('Move reference downloaded. Check the source date before relying on battle advice.')}catch(e){if(el)el.textContent=moveDBStatus();alert('Move download failed: '+e.message+'. Existing data remains unchanged.')}}
const SPECIES_DB_KEY='pokecommand-species-moves-v1';let speciesDB=null;try{let v=JSON.parse(localStorage.getItem(SPECIES_DB_KEY)||'null');if(v&&Array.isArray(v.records))speciesDB=v}catch(e){}
function speciesStatus(){return speciesDB?'Cached '+speciesDB.records.length+' species/form movesets. Downloaded '+new Date(speciesDB.fetchedAt).toLocaleString()+'. Source freshness unverified.':'No species movesets downloaded.'}
async function refreshSpeciesDB(){let el=document.getElementById('speciesDBStatus');if(el)el.textContent='Downloading species movesets...';try{let response=await fetch('https://pogoapi.net/api/v1/current_pokemon_moves.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);let records=await response.json();if(!Array.isArray(records)||records.length<500||!records.every(x=>typeof x.pokemon_name==='string'&&Array.isArray(x.fast_moves)&&Array.isArray(x.charged_moves)))throw Error('Unexpected moveset data');let db={records:records.map(x=>({name:x.pokemon_name,form:x.form||'Normal',fast:x.fast_moves,charged:x.charged_moves,eliteFast:x.elite_fast_moves||[],eliteCharged:x.elite_charged_moves||[]})),fetchedAt:new Date().toISOString()};localStorage.setItem(SPECIES_DB_KEY,JSON.stringify(db));speciesDB=db;if(el)el.textContent=speciesStatus();alert('Species movesets downloaded. Form and move availability may change; verify before using TMs.')}catch(e){if(el)el.textContent=speciesStatus();alert('Species download failed: '+e.message+'. Existing data is unchanged.')}}
function checkSpeciesMoves(id){let p=data.pokemon.find(x=>x.id===id);if(!p)return;if(!speciesDB){alert('Download species movesets in Settings first.');return}let norm=x=>String(x||'').trim().toLowerCase();let matches=speciesDB.records.filter(x=>norm(x.name)===norm(p.name));if(!matches.length){alert('No matching species found. Check the species name; special forms may be named differently.');return}let form=norm(p.form);let selected=form?matches.filter(x=>norm(x.form)===form):matches.length===1?matches:[];let validate=(move,kind)=>{if(!String(move||'').trim())return 'Not recorded';if(selected.length!==1)return 'Form not confirmed — select a form in the Pokémon editor';let x=selected[0],normal=kind==='fast'?x.fast:x.charged,elite=kind==='fast'?x.eliteFast:x.eliteCharged;if(normal.some(m=>norm(m)===norm(move)))return 'Listed in current moveset';if(elite.some(m=>norm(m)===norm(move)))return 'Listed as Elite/legacy';return 'Not listed for this form — verify manually (source may be outdated)'};let html='<p>Reference only. No saved moves will be changed. Source freshness is not independently verified.</p><p><b>Recorded Fast Attack:</b> '+esc(p.fast||'Not entered')+' — '+esc(validate(p.fast,'fast'))+'</p><p><b>Recorded Charged Attack:</b> '+esc(p.charged||'Not entered')+' — '+esc(validate(p.charged,'charged'))+'</p>'+(selected.length!==1?'<p class="notice">Multiple forms or no exact form match. Set the Form field in the editor to the exact reference form below before validating moves.</p>':'<p>Validated against form: <b>'+esc(selected[0].form)+'</b></p>')+matches.map(x=>'<details><summary>'+esc(x.name)+' — '+esc(x.form)+'</summary><p><b>Fast:</b> '+x.fast.map(esc).join(', ')+'</p><p><b>Charged:</b> '+x.charged.map(esc).join(', ')+'</p><p><b>Elite Fast:</b> '+(x.eliteFast.map(esc).join(', ')||'None listed')+'</p><p><b>Elite Charged:</b> '+(x.eliteCharged.map(esc).join(', ')||'None listed')+'</p></details>').join('');modal('Moveset check — '+p.name,html,()=>{})}

function moveType(p,kind){let override=(p[kind+'Type']||'').trim();let known=POKEMON_TYPES.find(t=>t.toLowerCase()===override.toLowerCase());if(override)return known||null;let move=(p[kind]||'').trim();if(moveDB&&moveDB.moves[move.toLowerCase()])return moveDB.moves[move.toLowerCase()];let key=Object.keys(MOVE_TYPES).find(k=>k.toLowerCase()===move.toLowerCase());return key?MOVE_TYPES[key]:null}

function referenceSelection(p){if(!speciesDB)return {status:'missing',matches:[]};let norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();let raw=String(p.name||'');let m=raw.match(/^(.+?)\s*\(([^)]+)\)\s*$/);let base=m?m[1]:raw,embedded=m?m[2]:'';let matches=speciesDB.records.filter(x=>norm(x.name)===norm(base));if(!matches.length)return {status:'species',matches:[]};let form=norm(p.form||embedded);let selected=form?matches.filter(x=>norm(x.form)===form):matches;if(selected.length===1)return {status:'matched',matches,record:selected[0]};if(!form&&matches.length>1){let normal=matches.filter(x=>['normal','standard',''].includes(norm(x.form)));if(normal.length===1)return {status:'matched',matches,record:normal[0]};let moveMatches=matches.filter(x=>{let f=norm(p.fast),c=norm(p.charged);return (!f||[...x.fast,...x.eliteFast].some(v=>norm(v)===f))&&(!c||[...x.charged,...x.eliteCharged].some(v=>norm(v)===c))});if(moveMatches.length===1)return {status:'matched',matches,record:moveMatches[0]}}return {status:'form',matches}}
const SPECIAL_MOVE_NOTES=[{species:'zacian',form:'crowned sword',move:'behemoth blade',note:'Signature move associated with Crowned Sword Zacian; source may omit special move availability.'}];
function specialMoveNote(p,move){let norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();let name=norm(p.name),form=norm(p.form);return SPECIAL_MOVE_NOTES.find(x=>name.includes(x.species)&&(name.includes(x.form)||form===x.form)&&norm(move)===x.move)?.note||''}
function moveConfidence(p){let norm=x=>String(x||'').trim().toLowerCase();if(!speciesDB)return 'Moveset not checked (download species data in Settings)';let result=referenceSelection(p);if(result.status==='species')return 'Species not found in reference';if(result.status!=='matched')return 'Form unconfirmed';let x=result.record;let check=(move,normal,elite)=>{if(!norm(move))return 'missing';if(normal.some(v=>norm(v)===norm(move)))return 'listed';if(elite.some(v=>norm(v)===norm(move)))return 'Elite/legacy';if(specialMoveNote(p,move))return 'special move (not listed by source)';return 'not listed'};let fast=check(p.fast,x.fast,x.eliteFast),charged=check(p.charged,x.charged,x.eliteCharged);return 'Fast '+fast+'; Charged '+charged+' (reference only)'}
function team(){let b=document.getElementById('boss');if(!b)return;let entry=bosses.find(x=>x[0]===b.value);if(!entry)return;let weak=entry[1].split(', ');let matches=data.pokemon.map(p=>{let fast=moveType(p,'fast'),charged=moveType(p,'charged');let fastMatch=!!fast&&weak.includes(fast),chargedMatch=!!charged&&weak.includes(charged);let knownCount=Number(!!fast)+Number(!!charged);let matchCount=Number(fastMatch)+Number(chargedMatch);let tier=matchCount===2?3:matchCount===1?2:knownCount===2?1:0;return {...p,fastTypeResolved:fast,chargedTypeResolved:charged,fastMatch,chargedMatch,tier,knownCount,matchCount}}).sort((a,b)=>b.tier-a.tier||b.matchCount-a.matchCount||b.knownCount-a.knownCount||Number(b.cp)-Number(a.cp));let stab=(p,type)=>{if(!type)return '';let types=resolvedPokemonTypes(p).types.map(x=>x.toLowerCase());return types.includes(type.toLowerCase())?' · STAB':''};let describe=p=>p.tier===3?'Both recorded attack types match':p.tier===2?'One recorded attack type matches':p.tier===1?'No recorded attack types match':'Insufficient move-type data';let explain=(move,type,match)=>!String(move||'').trim()?'Not recorded':!type?'Type unknown':esc(type)+(match?' · weakness match':' · no weakness match');document.getElementById('team').innerHTML='<p>Boss weaknesses: <b>'+weak.join(', ')+'</b></p>'+(matches.length?matches.slice(0,6).map((p,i)=>'<p>'+(i+1)+'. <b>'+esc(p.name)+'</b> · CP '+esc(p.cp)+'<br><small><b>'+esc(describe(p))+'</b></small><br><small>Fast: '+esc(p.fast||'Not recorded')+' ('+explain(p.fast,p.fastTypeResolved,p.fastMatch)+stab(p,p.fastTypeResolved)+')<br>Charged: '+esc(p.charged||'Not recorded')+' ('+explain(p.charged,p.chargedTypeResolved,p.chargedMatch)+stab(p,p.chargedTypeResolved)+')</small><br><small>Reference confidence: '+esc(moveConfidence(p))+'</small></p>').join(''):'<p>Add Pokémon to your collection to see candidates.</p>')+(matches.length&&!matches.some(p=>p.matchCount>0)?'<div class="notice">None of your recorded attacks match this boss\'s listed weaknesses. Consider checking alternative moves or other Pokémon before investing resources. This is not a prediction that the raid is unwinnable.</div>':'')+'<div class="notice">Candidates are grouped by recorded move-type coverage, then CP as a tiebreaker. This is NOT a damage, DPS, survival or battle performance ranking. Type matches use the listed boss weaknesses; STAB is labelled using manual types or uniquely matched downloaded species types; it does not affect ranking. Stats, resistances, Mega and Max mechanics are not simulated. Unknown moves are not treated as ineffective. Source freshness is unverified.</div>'}


function maxReadiness(){let root=document.getElementById('maxTeam');if(!root)return;let roster=data.pokemon.filter(p=>/dynamax|gigantamax/i.test(p.flags||''));if(!roster.length){root.innerHTML='<p>No Pokémon are marked Dynamax or Gigantamax yet. Edit a Pokémon and add one of those flags to include it here.</p>';return}let types=['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];let raw=(document.getElementById('maxWeaknesses')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);let valid=raw.map(x=>types.find(t=>t.toLowerCase()===x.toLowerCase())).filter(Boolean);let invalid=raw.filter(x=>!types.some(t=>t.toLowerCase()===x.toLowerCase()));let evaluated=roster.map(p=>{let fast=moveType(p,'fast');let match=!!fast&&valid.includes(fast);return {...p,fast,match}}).sort((a,b)=>Number(b.match)-Number(a.match)||Number(b.cp)-Number(a.cp));root.innerHTML=(invalid.length?'<p class="notice">Unrecognised types: '+invalid.map(esc).join(', ')+'. Use standard Pokémon type names.</p>':'')+(valid.length?'<p>Checking recorded Fast Attack types against: <b>'+valid.map(esc).join(', ')+'</b></p>':'<p class="muted">Add a boss weakness above to see potential type matches.</p>')+evaluated.map(p=>{let atk=Number(p.maxAttack)||0,guard=Number(p.maxGuard)||0,spirit=Number(p.maxSpirit)||0;let roles=[atk>0?'Max Attack Lv '+atk:'Max Attack not recorded',guard>0?'Max Guard Lv '+guard:'Max Guard not recorded',spirit>0?'Max Spirit Lv '+spirit:'Max Spirit not recorded'];let status=valid.length?(p.fast?(p.match?'✓ Fast Attack type matches entered weakness':'Fast Attack type does not match entered weaknesses'):'Fast Attack type unknown; no match assumed'):'Fast Attack type: '+(p.fast||'unknown');return '<div style="border-top:1px solid #34355e;padding:12px 0"><b>'+esc(p.nickname||p.name)+'</b> · CP '+esc(p.cp||'?')+'<br><small>'+esc(status)+'<br>'+roles.map(esc).join('<br>')+'</small><p>'+btn('Edit Max moves',"editPokemon('"+p.id+"')",'secondary')+'</p></div>'}).join('')+'<small>Matches only compare recorded Fast Attack types with manually entered boss weaknesses. Max Attack typing, species eligibility, defensive matchups, damage, team size and boss moves are not calculated. An unlocked Max Guard or Max Spirit is only a possible support option, not a role recommendation.</small>'}

function editMeetup(){modal('Plan meetup',field('name','Event name')+field('date','Date and time','', 'datetime-local')+field('place','Meeting location','Harmony Boulevard Park, Palmview')+field('notes','Details'),f=>data.community.push({id:uid(),name:f.get('name'),date:f.get('date'),place:f.get('place'),notes:f.get('notes')}))}
function deleteMeetup(id){if(confirm('Delete meetup?')){data.community=data.community.filter(x=>x.id!==id);save()}}function copyMeetup(id){let c=data.community.find(x=>x.id===id);navigator.clipboard.writeText(c.name+'\n'+c.date+'\n'+c.place+'\n'+c.notes).then(()=>alert('Copied!'))}
async function checkAppUpdates(){let btn=document.querySelector('header button[onclick="checkAppUpdates()"]');if(btn){btn.disabled=true;btn.textContent='Checking...'}try{let url=new URL('./index.html',location.href);url.searchParams.set('check',Date.now().toString());let response=await fetch(url.href,{cache:'no-store'});if(!response.ok)throw Error('Could not reach GitHub Pages (HTTP '+response.status+')');let html=await response.text();let found=html.match(/<meta name="pokecommand-build" content="([^"]+)"/);if(!found)throw Error('Published version marker not found');let current=document.querySelector('meta[name="pokecommand-build"]')?.content||'older';if(found[1]===current){alert('PokéCommand is up to date (v'+current+').');return}if(!confirm('PokéCommand v'+found[1]+' is available (installed: '+current+'). Reload to update now? Your locally saved Pokémon and hunts will not be cleared.'))return;if('serviceWorker'in navigator){let reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}let next=new URL(location.href);next.searchParams.set('appVersion',found[1]);location.replace(next.href)}catch(e){alert('Update check failed: '+e.message+'. Try opening the GitHub Pages website in your browser.')}finally{if(btn){btn.disabled=false;btn.textContent='↻ Update'}}}
function settings(){modal('Settings & backups',field('trainer','Trainer name',data.trainer)+'<p>Export a backup regularly. Data is stored only on this device/browser.</p><h3>Move reference database</h3><p id="moveDBStatus">'+esc(moveDBStatus())+'</p><p><button type="button" class="secondary" onclick="refreshMoveDB()">Download move data</button></p><h3>Species types</h3><p id="typeDBStatus">'+esc(typeDBStatus())+'</p><p><button type="button" class="secondary" onclick="refreshTypeDB()">Download species types</button></p><small>Manual types take priority; ambiguous forms are not guessed.</small><h3>Species movesets</h3><p id="speciesDBStatus">'+esc(speciesStatus())+'</p><p><button type="button" class="secondary" onclick="refreshSpeciesDB()">Download species movesets</button></p><small>Includes form-specific fast, charged and Elite move lists where provided. Source freshness is unverified.</small><small>Source: PoGoAPI. Downloads are optional; source freshness and move accuracy are not guaranteed. This reference is stored separately from your Pokémon collection.</small><button type="button" class="secondary" onclick="backup()">Export JSON backup</button><p><label>Restore JSON backup<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label></p>',f=>data.trainer=f.get('trainer')||'Trainer')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='pokecommand-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.hunts)||!Array.isArray(obj.pokemon)||!Array.isArray(obj.community))throw Error('Invalid format');if(confirm('Replace ALL saved data with this backup?')){data=obj;document.getElementById('modal').close();save()}}catch(e){alert('Could not restore backup: '+e.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
